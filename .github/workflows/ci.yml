name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - name: Smoke test Corpus Explorer runtime
        shell: bash
        run: |
          pnpm --filter @moonwitness/corpus-web start > /tmp/moonwitness-corpus-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/moonwitness-corpus-web.log
            exit 1
          fi

          grep -q 'Trace claims back to exact evidence' /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/datasets > /tmp/datasets.html
          grep -q 'Dataset catalog' /tmp/datasets.html
          curl --fail --silent --show-error 'http://127.0.0.1:3000/search?q=quran' > /tmp/search.html
          grep -q 'Results for' /tmp/search.html
