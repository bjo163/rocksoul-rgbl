name: Materialize Ancient Egyptian Book of the Dead Renouf Naville 1904

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [dev]
    paths:
      - 'scripts/materialize-ancient-egypt-book-dead-renouf-1904.ts'
      - 'ingestion/recipes/ancient-egypt-book-dead-renouf-1904/**'
      - 'datasets/ancient-egypt-book-dead-renouf/**'
      - 'datasets/registry.json'
      - 'ingestion/registry.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: ancient-egypt-renouf-materialization
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm materialize:ancient-egypt-renouf
      - run: pnpm validate:corpus
      - run: pnpm validate:editions
      - run: pnpm build:sqlite
      - run: pnpm home:stats
      - name: Commit generated corpus and Home statistics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/ancient-egypt-book-dead-renouf README.md
          if git diff --cached --quiet; then echo 'No generated changes.'; exit 0; fi
          git commit -m 'feat(corpus): materialize Renouf Naville 1904'
          git push origin HEAD:dev
