name: Materialize Ancient Egyptian Book of the Dead Renouf Naville 1904

on:
  workflow_dispatch:

concurrency:
  group: ancient-egypt-renouf-materialization
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  materialize:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm materialize:ancient-egypt-renouf
      - run: pnpm validate:corpus
      - run: pnpm validate:editions
