name: Materialize Zhuangzi Giles 1889

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [dev]
    paths:
      - 'ingestion/recipes/zhuangzi-giles-1889/**'
      - 'scripts/materialize-zhuangzi-giles-1889.ts'
      - 'datasets/registry.json'
      - 'datasets/zhuangzi-giles-1889/manifest.json'

concurrency:
  group: zhuangzi-materialization
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm materialize:zhuangzi
      - run: pnpm validate:corpus
      - run: pnpm validate:editions
      - run: pnpm build:sqlite
      - run: pnpm home:stats
      - name: Commit generated Zhuangzi corpus and Home statistics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/zhuangzi-giles-1889 README.md
          if git diff --cached --quiet; then echo 'No generated changes.'; exit 0; fi
          git commit -m 'feat(corpus): materialize Zhuangzi Giles 1889'
          git push origin HEAD:dev
