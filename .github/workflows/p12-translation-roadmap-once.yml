name: P12 translation roadmap one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p12-translation-roadmap-once.yml

permissions:
  contents: write

jobs:
  patch-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require English and Indonesian coverage in P12
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo = Path('TODO.md')
          text = todo.read_text(encoding='utf-8')

          old_p20 = '- [ ] Produce the Foundation Text Corpus coverage report and pass the no-unresolved-bundled-rights exit gate. <!-- mw-todo:P12-020 -->'
          new_p20 = '- [ ] Produce the Foundation Text Corpus coverage report and pass both the no-unresolved-bundled-rights gate and the required source-language + `en` + `id` translation-coverage gate. <!-- mw-todo:P12-020 -->'
          if old_p20 in text:
              text = text.replace(old_p20, new_p20, 1)
          elif new_p20 not in text:
              raise SystemExit('P12-020 anchor not found')

          additions = '''
- [ ] Enforce source-language + human-published English (`en`) + Indonesian (`id`) minimum coverage for every major P12 work/collection; machine/LLM translation must not satisfy canonical coverage. <!-- mw-todo:P12-021 -->
- [ ] Pin and ingest Quran English translation from QuranEnc / Rowwad Translation Center under exact source-preserving republication terms. <!-- mw-todo:P12-022 -->
- [ ] Pin and ingest Quran Indonesian translation from QuranEnc / Kementerian Agama Republik Indonesia under exact source-preserving republication terms. <!-- mw-todo:P12-023 -->
- [ ] Pin and ingest an open Indonesian Bible expression, starting with TSI Edisi Ketiga (CC BY-SA 4.0), with exact per-book completeness; use AGS only as an explicitly separate supplemental edition where useful. <!-- mw-todo:P12-024 -->
- [ ] Add Indonesian Bible passage alignments to WLC/SBLGNT/WEB where editions overlap, preserving book/verse and versification gaps explicitly. <!-- mw-todo:P12-025 -->
- [ ] Audit and ingest the Indonesian LP2KBI/Bimas Buddha Kemenag Dhammapada if its government/public-domain rights basis is independently verified; otherwise select another openly redistributable human Indonesian translation. <!-- mw-todo:P12-026 -->
- [ ] Audit and ingest human-published Indonesian coverage for DN/MN/SN/AN; keep unavailable passages explicit and never fill canonical gaps with machine translation. <!-- mw-todo:P12-027 -->'''

          if 'mw-todo:P12-021' not in text:
              text = text.replace(new_p20, new_p20 + additions, 1)

          old_exit = '**Exit gate:** the foundation corpus has source-pinned Arabic Quran, complete Dhammapada English with legally correct Pali handling, full source-preserving WLC Hebrew, SBLGNT v1.2 Greek, WEB Classic 2020 English, explicit permitted alignments, broader CC0 Sujato DN/MN/SN/AN coverage, deterministic checksums, and no unresolved rights for bundled content.'
          new_exit = '**Exit gate:** the foundation corpus has source-pinned Arabic Quran, source-preserving original-language backbones, human-published English (`en`) and Indonesian (`id`) translation coverage for every major P12 work/collection, complete Dhammapada handling, WLC Hebrew, SBLGNT v1.2 Greek, WEB English, explicit permitted alignments, broader DN/MN/SN/AN coverage, deterministic checksums, and no unresolved rights for bundled content. Machine/LLM translations never satisfy the canonical `en`/`id` gate.'
          if old_exit in text:
              text = text.replace(old_exit, new_exit, 1)
          elif new_exit not in text:
              raise SystemExit('P12 exit gate anchor not found')

          intro = 'P9–P11 are intentionally deferred while this data-first milestone is active. Exact sources, license evidence, and acceptance boundaries are documented in [`docs/DATASET_TARGETS.md`](docs/DATASET_TARGETS.md).'
          intro2 = 'P9–P11 are intentionally deferred while this data-first milestone is active. Exact sources, license evidence, and acceptance boundaries are documented in [`docs/DATASET_TARGETS.md`](docs/DATASET_TARGETS.md), with the required English/Indonesian policy in [`docs/TRANSLATION_TARGETS.md`](docs/TRANSLATION_TARGETS.md).'
          if intro in text:
              text = text.replace(intro, intro2, 1)

          todo.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p12-translation-roadmap-once.yml
          git add TODO.md
          git commit -m "roadmap: require English and Indonesian corpus coverage"
          git push origin HEAD:main
