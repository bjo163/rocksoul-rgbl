name: P5 Source Audit

on:
  push:
    branches:
      - feature/real-datasets-p5
    paths:
      - .github/workflows/p5-source-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/real-datasets-p5
      - name: Fetch pinned source artifacts
        run: |
          set -euo pipefail
          mkdir -p p5-source-audit
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/dotquran/corpus/c23f5cec2e95e253dc450bd0f34d09e37ba40fac/src/resources/uthmani.txt' \
            --output p5-source-audit/quran-uthmani-tanzil-v1.1.txt
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/suttacentral/bilara-data/cf0dac3b59a3f9b1d4829acb311e303f1eb6bba6/translation/en/sujato/sutta/kn/dhp/dhp1-20_translation-en-sujato.json' \
            --output p5-source-audit/dhammapada-1-20-en-sujato.json
          (cd p5-source-audit && sha256sum quran-uthmani-tanzil-v1.1.txt dhammapada-1-20-en-sujato.json > SHA256SUMS.txt)
          wc -c p5-source-audit/quran-uthmani-tanzil-v1.1.txt p5-source-audit/dhammapada-1-20-en-sujato.json
          cat p5-source-audit/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p5-source-audit
          path: p5-source-audit/
          if-no-files-found: error
          retention-days: 7
      - name: Commit audited source snapshots
        run: |
          set -euo pipefail
          mkdir -p ingestion/recipes/quran-tanzil-uthmani/source
          mkdir -p ingestion/recipes/dhammapada-sujato-1-20/source
          cp p5-source-audit/quran-uthmani-tanzil-v1.1.txt ingestion/recipes/quran-tanzil-uthmani/source/quran-uthmani-tanzil-v1.1.txt
          cp p5-source-audit/dhammapada-1-20-en-sujato.json ingestion/recipes/dhammapada-sujato-1-20/source/dhammapada-1-20-en-sujato.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ingestion/recipes/quran-tanzil-uthmani/source ingestion/recipes/dhammapada-sujato-1-20/source
          if git diff --cached --quiet; then
            echo 'Source snapshots already match the pinned artifacts.'
          else
            git commit -m 'data: pin audited P5 source snapshots [skip ci]'
            git push origin HEAD:feature/real-datasets-p5
          fi
