name: Aggressive Release

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [dev]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: aggressive-release
  cancel-in-progress: true

# Release is self-starting on validated dev changes.
jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout latest dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Detect unreleased dev work
        id: delta
        shell: bash
        run: |
          git fetch origin dev main --prune
          DEV_SHA="$(git rev-parse origin/dev)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$DEV_SHA" = "$MAIN_SHA" ]; then echo "has_changes=false" >> "$GITHUB_OUTPUT"; else echo "has_changes=true" >> "$GITHUB_OUTPUT"; fi
      - name: Materialize fast-track corpus before validation
        if: steps.delta.outputs.has_changes == 'true'
        shell: bash
        run: |
          pnpm materialize:zhuangzi
          pnpm materialize:ancient-egypt-budge
          pnpm materialize:ancient-egypt-renouf
      - name: Create automatic patch release plan
        if: steps.delta.outputs.has_changes == 'true'
        shell: bash
        run: |
          PLAN="release/changes/auto-$(date -u +%Y%m%d%H%M%S).json"
          cat > "$PLAN" <<'JSON'
          {"format":"moonwitness-release-change-v1","summary":"Automatic corpus release from validated dev changes.","corpusRelease":"patch"}
          JSON
          echo "RELEASE_PLAN=$PLAN" >> "$GITHUB_ENV"
      - name: Validate latest corpus
        if: steps.delta.outputs.has_changes == 'true'
        run: pnpm check
      - name: Bump release version
        if: steps.delta.outputs.has_changes == 'true'
        run: pnpm release:version "$RELEASE_PLAN"
      - name: Refresh Home statistics before promotion
        if: steps.delta.outputs.has_changes == 'true'
        run: pnpm build:sqlite && pnpm home:stats
      - name: Commit release version and Home state
        if: steps.delta.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/ release/ README.md dist/ datasets/zhuangzi-giles-1889 datasets/ancient-egypt-book-dead-budge datasets/ancient-egypt-book-dead-renouf
          if git diff --cached --quiet; then exit 0; fi
          VERSION="$(node -p "require('./release/corpus-release.json').version")"
          git commit -m "chore(release): promote corpus ${VERSION}"
          git push origin HEAD:dev
      - name: Promote validated release to main
        if: steps.delta.outputs.has_changes == 'true'
        shell: bash
        run: |
          git fetch origin dev main --prune
          DEV_SHA="$(git rev-parse origin/dev)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$MAIN_SHA" "$DEV_SHA"; then exit 1; fi
          git push origin "$DEV_SHA:refs/heads/main"
