services:
  corpus-engine:
    build: .
    container_name: moonwitness-corpus-api
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
